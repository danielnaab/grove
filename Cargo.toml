[package]
name = "grove"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Keep your git checkouts in view. Read only."
publish = false

[dependencies]
# Kept deliberately few; see AGENTS.md ("Dev kit") before adding one.
clap = { version = "4.5", features = ["derive"] }   # the CLI (family convention)
serde = { version = "1", features = ["derive"] }    # config and JSON models
serde_json = "1"                                    # --json output; runs/1 and status/1 input
toml = "0.9"                                        # grove.toml, with spans for file:line reporting
glob = "0.3"                                        # [discover] scan and ignore globs; no dependencies

[dev-dependencies]
trycmd = "0.15"                                     # Markdown CLI transcripts (docs/reference/cli)
tempfile = "3"                                      # throwaway fixture worlds

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
