# cargo-deny: `nix flake check` runs `bans licenses sources`.
# Advisories need the network: run `cargo deny check advisories` in `nix develop`.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # humantime is unmaintained (2026-11-22). grove dropped it (RFC 3339 in src/output.rs); only trycmd, a dev
  # dependency that runs the transcripts, still pulls it in (0.15 and 1.2 alike), and it never ships in grove.
  # Drop this line when trycmd does. If grove ever depends on humantime again, this ignore must go first.
  { id = "RUSTSEC-2026-0542", reason = "dev-only, through trycmd; grove's binary does not link humantime" },
]

[licenses]
# grove itself is unpublished and unlicensed for now; check only its dependencies.
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
